#服务器端口
server:
  port: 9104

#数据源配置
spring:
  datasource:
    url: ${blade.datasource.flow.dev.url}
    username: ${blade.datasource.flow.dev.username}
    password: ${blade.datasource.flow.dev.password}

flowable:
  database-schema-update: true
  check-process-definitions: false
  history-level: audit
  variable-json-mapper: jackson2
  async-executor-activate: true

# Flowable 异步任务执行器需要保持开启，避免定时器和异步任务失效。
# 仅过滤执行器周期性产生的正常空轮询 SQL，保留其他业务 SQL 日志。
blade:
  mybatis-plus:
    sql-log-exclude:
      - "from ACT_RU_JOB"
      - "from ACT_RU_TIMER_JOB"
      - "from ACT_RU_EXTERNAL_JOB"

# 隐藏健康检查噪声，并避免开发日志输出 Token、Cookie 和完整响应数据。
logging:
  level:
    com.alibaba.cloud.sentinel.endpoint.SentinelHealthIndicator: WARN
    org.springblade.core.boot.logger.RequestLogAspect: WARN
